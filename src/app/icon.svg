<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#0ea5e9" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Accent Inner Glow -->
  <rect x="7" y="7" width="50" height="50" rx="13" fill="#0ea5e9" fill-opacity="0.08" />

  <!-- ApplyWise Zap Lightning Icon -->
  <path
    d="M35 14L19 34h12l-4 16 18-22H33l4-14z"
    fill="url(#zapGrad)"
    stroke="#7dd3fc"
    stroke-width="1.2"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#glow)"
  />
</svg>
