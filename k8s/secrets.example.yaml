apiVersion: v1
kind: Secret
metadata:
  name: applywise-ai-secrets
  namespace: applywise-ai
  labels:
    app.kubernetes.io/name: applywise-ai
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Base64 encoded or stringData plaintext placeholders for local / staging clusters
  OPENCODE_ZEN_API_KEY: "free_tier_active"
  FREE_ONLY_MODE: "true"
  NEXT_PUBLIC_SUPABASE_URL: "https://your-project.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "replace-with-your-supabase-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "replace-with-your-supabase-service-role-key"
  ADZUNA_APP_ID: "replace-with-your-adzuna-id"
  ADZUNA_APP_KEY: "replace-with-your-adzuna-key"
