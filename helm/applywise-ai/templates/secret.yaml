{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "applywise-ai.fullname" . }}-secrets
  labels:
    {{- include "applywise-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCODE_ZEN_API_KEY: {{ .Values.secrets.opencodeZenApiKey | default "free_tier_active" | quote }}
  FREE_ONLY_MODE: "true"
  NEXT_PUBLIC_SUPABASE_URL: {{ .Values.secrets.supabaseUrl | default "https://placeholder.supabase.co" | quote }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: {{ .Values.secrets.supabaseAnonKey | default "placeholder-anon-key" | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.supabaseServiceRoleKey | default "placeholder-service-role" | quote }}
  ADZUNA_APP_ID: {{ .Values.secrets.adzunaAppId | default "placeholder-adzuna-id" | quote }}
  ADZUNA_APP_KEY: {{ .Values.secrets.adzunaAppKey | default "placeholder-adzuna-key" | quote }}
{{- end }}
