# =============================================================================
# ApplyWise AI — Prometheus Configuration
# Supports both Local Scraping and Grafana Cloud Free Remote Write
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: applywise-ai
    environment: production
    candidate: whitemore-ngwira

rule_files:
  - "alerts.yml"

scrape_configs:
  # 1. ApplyWise AI Application Metrics Endpoint
  - job_name: "applywise-app"
    metrics_path: "/api/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:3000", "app:3000"]
        labels:
          tier: "application"
          service: "applywise-ai"

  # 2. Kubernetes Pod Scrape (When running inside cluster via Service / Pod Annotations)
  - job_name: "kubernetes-pods"
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

