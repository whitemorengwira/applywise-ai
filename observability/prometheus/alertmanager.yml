# =============================================================================
# ApplyWise AI — Alertmanager Configuration
# Routes Operational & Critical Prometheus Alerts to Zoho Business Mailbox
# Recipient: whitemore@nwhite.systems
# =============================================================================

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.zoho.com:587"
  smtp_from: "whitemore@nwhite.systems"
  smtp_auth_username: "whitemore@nwhite.systems"
  smtp_require_tls: true

route:
  group_by: ["alertname", "severity", "service"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: "applywise-zoho-webhook"
  routes:
    - match:
        severity: CRITICAL
      receiver: "applywise-zoho-webhook"
      group_wait: 5s
      repeat_interval: 1h
    - match:
        channel: zoho-email
      receiver: "applywise-zoho-webhook"

receivers:
  # Primary Webhook Receiver: ApplyWise AI Webhook Alert Dispatcher
  - name: "applywise-zoho-webhook"
    webhook_configs:
      - url: "http://app:3000/api/alerts/webhook"
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 10

  # Direct Zoho Email Fallback (when SMTP credentials are provided directly to Alertmanager)
  - name: "zoho-email-direct"
    email_configs:
      - to: "whitemore@nwhite.systems"
        from: "whitemore@nwhite.systems"
        smarthost: "smtp.zoho.com:587"
        auth_username: "whitemore@nwhite.systems"
        require_tls: true
        send_resolved: true
        headers:
          Subject: "ApplyWise AI Alert: {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})"
